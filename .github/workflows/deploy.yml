name: Deploy to Namecheap

# Every push to main runs the tests and, if they pass, ships the site to the
# Namecheap (cPanel) server over SSH. Can also be started by hand from the
# GitHub "Actions" tab ("Run workflow").
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST         server hostname or IP (from Namecheap/cPanel)
#   SSH_PORT         21098 on Namecheap shared hosting
#   SSH_USER         your cPanel username
#   SSH_PRIVATE_KEY  private key whose public half is authorized in cPanel > SSH Access
#
# The app lives in ~/gp-transmission on the server; public_html is a symlink to
# ~/gp-transmission/public (see docs/DEPLOYMENT.md). The server's .env and
# storage/ are never overwritten by a deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: gp-transmission   # relative to the cPanel user's home directory

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Views call @vite(), which needs the build manifest to render.
      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          rm -f public/hot

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            Port $SSH_PORT
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Put site in maintenance mode
        # "|| true": on the very first deploy there is no app on the server yet.
        run: ssh prod "cd ~/$DEPLOY_PATH 2>/dev/null && php artisan down --retry=15 || true"

      - name: Upload files
        # Excluded paths are neither uploaded nor deleted on the server, so the
        # server's .env, logs, sessions and uploaded files survive every deploy.
        run: |
          rsync -az --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.claude/' \
            --exclude='/.superpowers/' \
            --exclude='/docs/' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/docker-compose*.yml' \
            --exclude='/phpunit.xml' \
            --exclude='/.phpunit.result.cache' \
            --exclude='/test-mail-routes.php' \
            --exclude='/storage/app/*' \
            --exclude='/storage/logs/*' \
            --exclude='/storage/framework/cache/*' \
            --exclude='/storage/framework/sessions/*' \
            --exclude='/storage/framework/views/*' \
            --exclude='/bootstrap/cache/*.php' \
            --exclude='/public/storage' \
            ./ prod:~/$DEPLOY_PATH/

      - name: Migrate, rebuild caches, go live
        run: |
          ssh prod "set -e
            cd ~/$DEPLOY_PATH
            mkdir -p storage/app/public storage/logs bootstrap/cache \
                     storage/framework/cache/data storage/framework/sessions storage/framework/views
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            php artisan storage:link 2>/dev/null || true
            php artisan up"

      - name: Bring site back up if the deploy failed
        if: failure()
        run: ssh prod "cd ~/$DEPLOY_PATH && php artisan up" || true
